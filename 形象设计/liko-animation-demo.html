<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f4" />
  <title>Liko · 五状态动画原型</title>
  <style>
    :root {
      --shell: #e95f68;
      --shell-light: #ff8a8f;
      --shell-deep: #b93e4b;
      --skin: #fff0c7;
      --skin-light: #fffaf0;
      --skin-deep: #edc77e;
      --leaf: #78bd63;
      --leaf-deep: #3f8e55;
      --ink: #4a3540;
      --muted: #806b73;
      --paper: #fffaf7;
      --panel: rgba(255, 255, 255, .9);
      --line: rgba(115, 83, 94, .12);
      --shadow: rgba(136, 75, 92, .15);
      --accent: #ec6e79;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 10% 3%, rgba(255, 202, 202, .42), transparent 28rem),
        radial-gradient(circle at 96% 80%, rgba(255, 221, 184, .42), transparent 28rem),
        linear-gradient(145deg, #fffdfb 0%, #fff7f3 52%, #fffaf2 100%);
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 3px solid rgba(109, 89, 207, .35);
      outline-offset: 3px;
    }

    .app {
      width: min(100% - 24px, 1040px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
    }

    .app-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 2px 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #bb5360;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 7vw, 40px);
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .head-note {
      max-width: 390px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: right;
    }

    .workspace {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .stage-card,
    .control-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 20px 55px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .stage-card {
      position: relative;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
    }

    .stage-card::before,
    .stage-card::after {
      position: absolute;
      z-index: -1;
      content: "";
      border-radius: 50%;
      filter: blur(1px);
    }

    .stage-card::before {
      width: 270px;
      height: 270px;
      top: -118px;
      right: -92px;
      background: color-mix(in srgb, var(--shell-light) 25%, transparent);
    }

    .stage-card::after {
      width: 250px;
      height: 250px;
      bottom: -130px;
      left: -90px;
      background: color-mix(in srgb, var(--skin) 60%, transparent);
    }

    .stage-top {
      position: absolute;
      z-index: 3;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .live-state,
    .serial {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid rgba(114, 79, 91, .1);
      border-radius: 999px;
      background: rgba(255, 255, 255, .75);
      color: #765c65;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .live-state::before {
      width: 8px;
      height: 8px;
      margin-right: 7px;
      content: "";
      border-radius: 50%;
      background: var(--shell);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--shell) 15%, transparent);
      animation: statusPulse 2s ease-in-out infinite;
    }

    .serial {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      letter-spacing: .06em;
    }

    .svg-wrap {
      display: grid;
      place-items: center;
      min-height: 500px;
      padding: 58px 10px 64px;
    }

    #liko {
      width: min(100%, 500px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 22px 22px color-mix(in srgb, var(--shell-deep) 20%, transparent));
    }

    .stage-copy {
      position: absolute;
      z-index: 3;
      right: 18px;
      bottom: 18px;
      left: 18px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .stage-copy strong,
    .stage-copy span { display: block; }

    .stage-copy strong {
      margin-bottom: 4px;
      font-size: 18px;
    }

    .stage-copy span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .identity-rule {
      flex: none;
      color: #a04c58;
      font-size: 11px;
      font-weight: 700;
      text-align: right;
    }

    .control-card {
      display: grid;
      align-content: start;
      gap: 20px;
      padding: 18px;
    }

    .control-card > *,
    .control-section,
    .state-tabs,
    .palette-row {
      min-width: 0;
      max-width: 100%;
    }

    .control-section h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .state-tabs {
      display: flex;
      gap: 8px;
      padding: 2px 2px 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .state-tabs::-webkit-scrollbar { display: none; }

    .state-btn {
      flex: 0 0 82px;
      min-height: 66px;
      padding: 9px 8px;
      border: 1px solid rgba(113, 79, 91, .13);
      border-radius: 18px;
      color: #79626a;
      background: rgba(255, 255, 255, .72);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background-color .18s ease;
    }

    .state-btn:hover { transform: translateY(-2px); }

    .state-btn[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--shell) 50%, white);
      color: var(--ink);
      background: color-mix(in srgb, var(--shell-light) 20%, white);
    }

    .state-btn b,
    .state-btn small { display: block; }

    .state-btn b {
      margin-bottom: 3px;
      font-size: 13px;
    }

    .state-btn small {
      color: #9a858c;
      font-size: 10px;
    }

    .palette-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }

    .palette-row + .palette-row { border-top: 1px solid var(--line); }

    .palette-label {
      flex: none;
      color: #765d66;
      font-size: 12px;
      font-weight: 700;
    }

    .swatches {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      min-width: 0;
    }

    .swatch {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px rgba(85, 60, 69, .14);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .swatch:hover,
    .swatch[aria-pressed="true"] {
      transform: scale(1.12);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch) 35%, white);
    }

    .randomize {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: #604d91;
      cursor: pointer;
      font-weight: 700;
      transition: transform .18s ease, opacity .18s ease;
    }

    .randomize:hover { transform: translateY(-1px); }
    .randomize:active { transform: translateY(1px); opacity: .88; }

    .rule-note {
      margin: 0;
      padding: 13px 14px;
      border-radius: 16px;
      color: #78636b;
      background: rgba(250, 238, 232, .72);
      font-size: 11px;
      line-height: 1.7;
    }

    /* Liko 双层身体 */
    .liko-character {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: idleBreathe 3.2s ease-in-out infinite;
    }

    .shell-fill { fill: url(#shellGradient); }
    .shell-stroke { stroke: var(--shell-deep); }
    .skin-fill { fill: url(#skinGradient); }
    .skin-solid { fill: var(--skin); }
    .skin-stroke { stroke: var(--skin-deep); }
    .ink-fill { fill: var(--ink); }

    .shell-outline {
      stroke: var(--shell-deep);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .inner-outline {
      stroke: var(--skin-deep);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .leaf {
      fill: url(#leafGradient);
      stroke: var(--leaf-deep);
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .leaf-cluster {
      transform-box: fill-box;
      transform-origin: 35% 90%;
      animation: leafSway 3.2s ease-in-out infinite;
    }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.6s ease-in-out infinite;
    }

    .cheek { fill: #ef8f9a; opacity: .6; }

    .state-layer { display: none; }
    #liko[data-state="idle"] .state-idle,
    #liko[data-state="study"] .state-study,
    #liko[data-state="music"] .state-music,
    #liko[data-state="fitness"] .state-fitness,
    #liko[data-state="gaming"] .state-gaming { display: block; }

    #liko[data-state="study"] .liko-character { animation: studyBob 2.7s ease-in-out infinite; }
    #liko[data-state="music"] .liko-character { animation: musicSway 1.15s ease-in-out infinite alternate; }
    #liko[data-state="fitness"] .liko-character { animation: squat 1.5s ease-in-out infinite; }
    #liko[data-state="gaming"] .liko-character { animation: gameBounce 1.7s ease-in-out infinite; }

    .wave-hand {
      transform-box: fill-box;
      transform-origin: 35% 85%;
      animation: handWave 1.8s ease-in-out infinite;
    }

    .idle-dot-a { animation: idleDot 2.8s ease-in-out infinite; }
    .idle-dot-b { animation: idleDot 2.8s .45s ease-in-out infinite; }
    .idle-dot-c { animation: idleDot 2.8s .9s ease-in-out infinite; }

    .book {
      transform-box: fill-box;
      transform-origin: center;
      animation: bookFloat 2.7s ease-in-out infinite;
    }

    .page-flip {
      transform-box: fill-box;
      transform-origin: left bottom;
      animation: pageFlip 3.6s ease-in-out infinite;
    }

    .study-spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkle 2.5s ease-in-out infinite;
    }

    .headphone-band {
      fill: none;
      stroke: #6d68c9;
      stroke-width: 12;
      stroke-linecap: round;
    }

    .headphone-pad {
      fill: #756fda;
      stroke: #4e489f;
      stroke-width: 3;
    }

    .music-note-a { animation: noteRise 2.2s ease-out infinite; }
    .music-note-b { animation: noteRise 2.2s .7s ease-out infinite; }
    .music-note-c { animation: noteRise 2.2s 1.35s ease-out infinite; }

    .fitness-arms,
    .fitness-bar {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: lift 1.5s ease-in-out infinite;
    }

    .sweat {
      transform-box: fill-box;
      transform-origin: center;
      animation: sweatDrop 1.5s ease-in infinite;
    }

    .controller {
      transform-box: fill-box;
      transform-origin: center;
      animation: controllerTap .65s ease-in-out infinite alternate;
    }

    .game-glow-a { animation: gamePixel 1.5s ease-out infinite; }
    .game-glow-b { animation: gamePixel 1.5s .55s ease-out infinite; }

    @keyframes statusPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.78); opacity: .62; }
    }

    @keyframes idleBreathe {
      0%, 100% { transform: translateY(1px) scale(1); }
      50% { transform: translateY(-5px) scale(1.012, .99); }
    }

    @keyframes studyBob {
      0%, 100% { transform: translateY(1px) rotate(-.4deg); }
      50% { transform: translateY(-4px) rotate(.4deg); }
    }

    @keyframes musicSway {
      from { transform: translate(-5px, 1px) rotate(-2deg); }
      to { transform: translate(5px, -4px) rotate(2deg); }
    }

    @keyframes squat {
      0%, 100% { transform: translateY(-5px) scaleY(1.02); }
      50% { transform: translateY(13px) scale(1.018, .95); }
    }

    @keyframes gameBounce {
      0%, 100% { transform: translateY(2px) rotate(-.6deg); }
      50% { transform: translateY(-6px) rotate(.6deg); }
    }

    @keyframes leafSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes blink {
      0%, 43%, 47%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(.1); }
    }

    @keyframes handWave {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(16deg) translateY(-2px); }
    }

    @keyframes idleDot {
      0%, 22%, 100% { transform: translateY(8px) scale(.55); opacity: 0; }
      42%, 72% { transform: translateY(0) scale(1); opacity: .75; }
    }

    @keyframes bookFloat {
      0%, 100% { transform: translateY(1px) rotate(-.7deg); }
      50% { transform: translateY(-4px) rotate(.7deg); }
    }

    @keyframes pageFlip {
      0%, 18%, 100% { transform: scaleX(1) skewX(0); opacity: .9; }
      45% { transform: scaleX(.18) skewX(-17deg); opacity: .35; }
      62% { transform: scaleX(1) skewX(7deg); opacity: .9; }
    }

    @keyframes sparkle {
      0%, 22%, 100% { transform: scale(.4) rotate(-12deg); opacity: 0; }
      42%, 70% { transform: scale(1) rotate(8deg); opacity: 1; }
    }

    @keyframes noteRise {
      0% { transform: translateY(16px) scale(.7); opacity: 0; }
      20%, 76% { opacity: 1; }
      100% { transform: translateY(-30px) scale(1.08) rotate(8deg); opacity: 0; }
    }

    @keyframes lift {
      0%, 100% { transform: translateY(18px); }
      50% { transform: translateY(-15px); }
    }

    @keyframes sweatDrop {
      0%, 40% { transform: translateY(0) scale(.6); opacity: 0; }
      55% { opacity: 1; }
      100% { transform: translate(5px, 24px) scale(1); opacity: 0; }
    }

    @keyframes controllerTap {
      from { transform: rotate(-2deg) translateY(1px); }
      to { transform: rotate(2deg) translateY(-2px); }
    }

    @keyframes gamePixel {
      0% { transform: translateY(12px) scale(.4); opacity: 0; }
      25%, 70% { opacity: 1; }
      100% { transform: translateY(-25px) scale(1.1) rotate(16deg); opacity: 0; }
    }

    @media (min-width: 820px) {
      .workspace { grid-template-columns: minmax(0, 1.45fr) minmax(300px, .75fr); }
      .control-card { padding: 22px; }
      .state-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
      .state-btn { width: 100%; }
      .state-btn:last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 600px) {
      .app { width: min(100% - 16px, 1040px); }
      .app-head { display: block; padding-inline: 6px; }
      .head-note { margin-top: 8px; text-align: left; }
      .stage-card, .control-card { border-radius: 24px; }
      .stage-card { min-height: 500px; }
      .svg-wrap { min-height: 445px; padding: 54px 0 70px; }
      .stage-copy span { max-width: 250px; }
      .identity-rule { display: none; }
      .palette-row { align-items: flex-start; }
      .swatches { flex-wrap: wrap; }
      .swatch { width: 28px; height: 28px; }
    }

    @media (max-width: 380px) {
      .stage-card { min-height: 462px; }
      .svg-wrap { min-height: 410px; padding-bottom: 65px; }
      .stage-top { top: 13px; right: 13px; left: 13px; }
      .stage-copy { right: 14px; bottom: 14px; left: 14px; }
      .stage-copy strong { font-size: 16px; }
      .stage-copy span { max-width: 210px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-head">
      <div>
        <p class="eyebrow">Liko Motion Prototype</p>
        <h1>一只草木感的荔枝小伙伴</h1>
      </div>
      <p class="head-note">外层是完整荔枝壳，内层是柔软本体。颜色独立生成，编号只由注册顺序决定。</p>
    </header>

    <section class="workspace" aria-label="Liko 动画与配色预览">
      <article class="stage-card">
        <div class="stage-top">
          <div class="live-state" id="liveState">正在安静待机</div>
          <div class="serial">No. 000128</div>
        </div>

        <div class="svg-wrap">
          <svg id="liko" data-state="idle" viewBox="0 0 420 440" role="img" aria-labelledby="likoTitle likoDesc">
            <title id="likoTitle">Liko 待机动画</title>
            <desc id="likoDesc">一个穿着完整荔枝壳的柔软小角色，前部开口露出脸，手脚与内层本体同色，顶部有枝梗和两片叶子。</desc>
            <defs>
              <linearGradient id="shellGradient" x1=".16" y1=".08" x2=".86" y2=".95">
                <stop offset="0" style="stop-color:var(--shell-light)" />
                <stop offset=".58" style="stop-color:var(--shell)" />
                <stop offset="1" style="stop-color:var(--shell-deep)" />
              </linearGradient>
              <linearGradient id="skinGradient" x1=".18" y1=".08" x2=".78" y2=".96">
                <stop offset="0" style="stop-color:var(--skin-light)" />
                <stop offset=".68" style="stop-color:var(--skin)" />
                <stop offset="1" style="stop-color:var(--skin-deep)" />
              </linearGradient>
              <linearGradient id="leafGradient" x1=".2" y1=".1" x2=".85" y2=".9">
                <stop offset="0" style="stop-color:#a9dc78" />
                <stop offset="1" style="stop-color:var(--leaf)" />
              </linearGradient>
              <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="7" />
              </filter>
            </defs>

            <ellipse cx="210" cy="402" rx="118" ry="17" fill="var(--shell)" opacity=".14" />

            <g class="liko-character">
              <!-- 脚和枝叶从完整外壳后方伸出 -->
              <ellipse class="skin-fill inner-outline" cx="164" cy="367" rx="35" ry="25" transform="rotate(-10 164 367)" />
              <ellipse class="skin-fill inner-outline" cx="256" cy="367" rx="35" ry="25" transform="rotate(10 256 367)" />

              <path d="M231 91 C234 64 244 45 258 26" fill="none" stroke="#9b673e" stroke-width="14" stroke-linecap="round" />
              <g class="leaf-cluster">
                <path class="leaf" d="M250 53 C271 22 313 18 333 39 C310 62 277 70 250 53 Z" />
                <path class="leaf" d="M259 55 C290 48 319 65 322 91 C290 94 266 80 259 55 Z" />
                <path d="M260 54 C282 46 302 39 321 38 M270 62 C286 69 300 78 313 87" fill="none" stroke="var(--leaf-deep)" stroke-width="3" stroke-linecap="round" opacity=".7" />
              </g>

              <!-- 完整外壳背板 -->
              <path class="shell-fill shell-outline" d="M210 70 C231 63 250 70 262 87 C283 77 306 86 313 105 C335 101 352 117 350 138 C371 145 378 167 367 185 C385 200 385 224 368 239 C381 258 372 281 351 288 C356 311 339 330 316 329 C312 351 291 362 270 352 C258 373 230 375 211 359 C192 375 164 371 152 351 C129 360 107 347 104 325 C80 326 64 306 71 283 C50 274 45 250 60 233 C43 216 47 191 66 180 C56 158 68 137 89 132 C87 110 105 94 127 98 C138 79 160 73 178 87 C188 76 198 71 210 70 Z" />

              <!-- 开口中的内层本体 -->
              <path class="skin-fill inner-outline" d="M210 123 C264 122 300 158 301 221 C302 282 271 318 210 322 C149 318 118 282 119 221 C120 158 156 122 210 123 Z" />
              <ellipse cx="175" cy="162" rx="30" ry="16" fill="var(--skin-light)" opacity=".45" transform="rotate(-20 175 162)" />

              <!-- 外壳前沿：覆盖内层边缘，明确表达“壳穿在外面” -->
              <path class="shell-fill shell-outline" fill-rule="evenodd" d="M210 70 C231 63 250 70 262 87 C283 77 306 86 313 105 C335 101 352 117 350 138 C371 145 378 167 367 185 C385 200 385 224 368 239 C381 258 372 281 351 288 C356 311 339 330 316 329 C312 351 291 362 270 352 C258 373 230 375 211 359 C192 375 164 371 152 351 C129 360 107 347 104 325 C80 326 64 306 71 283 C50 274 45 250 60 233 C43 216 47 191 66 180 C56 158 68 137 89 132 C87 110 105 94 127 98 C138 79 160 73 178 87 C188 76 198 71 210 70 Z M210 111 C143 111 105 155 106 225 C107 294 143 332 210 335 C277 332 313 294 314 225 C315 155 277 111 210 111 Z" opacity=".98" />

              <!-- 荔枝壳纹理，固定在服装上，非随机配饰 -->
              <g fill="none" stroke="var(--shell-light)" stroke-width="3" stroke-linecap="round" opacity=".65">
                <path d="M119 126 q10 -8 20 0 M88 184 q10 -8 20 1 M90 266 q10 -7 20 1 M126 323 q10 -7 20 1" />
                <path d="M281 119 q10 -7 20 1 M320 177 q10 -7 20 1 M316 265 q10 -7 20 1 M276 327 q10 -7 20 1" />
              </g>

              <!-- 通用脸部 -->
              <ellipse class="eye ink-fill" cx="181" cy="214" rx="8" ry="11" />
              <ellipse class="eye ink-fill" cx="239" cy="214" rx="8" ry="11" />
              <ellipse class="cheek" cx="160" cy="241" rx="15" ry="7" />
              <ellipse class="cheek" cx="260" cy="241" rx="15" ry="7" />

              <!-- 待机：轻呼吸、眨眼、挥手 -->
              <g class="state-layer state-idle">

      <aside class="control-card">
        <section class="control-section">
          <h2>五个循环状态</h2>
          <div class="state-tabs" role="group" aria-label="选择 Liko 动画状态">
            <button class="state-btn" type="button" data-state="idle" aria-pressed="true"><b>待机</b><small>呼吸挥手</small></button>
            <button class="state-btn" type="button" data-state="study" aria-pressed="false"><b>学习</b><small>阅读翻页</small></button>
            <button class="state-btn" type="button" data-state="music" aria-pressed="false"><b>听歌</b><small>耳机摇摆</small></button>
            <button class="state-btn" type="button" data-state="fitness" aria-pressed="false"><b>健身</b><small>举重深蹲</small></button>
            <button class="state-btn" type="button" data-state="gaming" aria-pressed="false"><b>游戏</b><small>手柄反馈</small></button>

        </section>

        <section class="control-section">
          <h2>内外颜色独立</h2>
          <div class="palette-row">
            <span class="palette-label">外层荔枝壳</span>
            <div class="swatches" role="group" aria-label="选择外壳颜色">
              <button class="swatch shell-swatch" type="button" data-palette="lychee" aria-label="荔枝红" aria-pressed="true" style="--swatch:#e95f68"></button>
              <button class="swatch shell-swatch" type="button" data-palette="coral" aria-label="珊瑚橙" aria-pressed="false" style="--swatch:#ef8357"></button>
              <button class="swatch shell-swatch" type="button" data-palette="grape" aria-label="葡萄紫" aria-pressed="false" style="--swatch:#9171c9"></button>
              <button class="swatch shell-swatch" type="button" data-palette="jade" aria-label="青玉绿" aria-pressed="false" style="--swatch:#53a889"></button>
              <button class="swatch shell-swatch" type="button" data-palette="ocean" aria-label="海洋蓝" aria-pressed="false" style="--swatch:#5d91cf"></button>
            </div>
          </div>
          <div class="palette-row">
            <span class="palette-label">内层本体肤色</span>
            <div class="swatches" role="group" aria-label="选择内层肤色">
              <button class="swatch skin-swatch" type="button" data-palette="cream" aria-label="奶油色" aria-pressed="true" style="--swatch:#fff0c7"></button>
              <button class="swatch skin-swatch" type="button" data-palette="peach" aria-label="蜜桃色" aria-pressed="false" style="--swatch:#ffd2c5"></button>
              <button class="swatch skin-swatch" type="button" data-palette="mint" aria-label="薄荷色" aria-pressed="false" style="--swatch:#caefdc"></button>
              <button class="swatch skin-swatch" type="button" data-palette="lilac" aria-label="丁香色" aria-pressed="false" style="--swatch:#ded5f4"></button>
              <button class="swatch skin-swatch" type="button" data-palette="sky" aria-label="晴空色" aria-pressed="false" style="--swatch:#d2e8f5"></button>
            </div>

        <button class="randomize" id="randomize" type="button">重新随机内外配色</button>

        <p class="rule-note">
          注册时从审核过的外壳色板和肤色色板中分别抽取，两者不互相绑定；生成后保存。编号 <b>No. 000128</b> 只是注册顺序示例，与任何颜色无关。
        </p>
      </aside>
    </section>
  </main>

  <script>
    const shellPalettes = {
      lychee: { shell: '#e95f68', light: '#ff8a8f', deep: '#b93e4b' },
      coral:  { shell: '#ef8357', light: '#ffad7d', deep: '#bd5939' },
      grape:  { shell: '#9171c9', light: '#bba1e6', deep: '#66499d' },
      jade:   { shell: '#53a889', light: '#85ceb3', deep: '#31745f' },
      ocean:  { shell: '#5d91cf', light: '#91b9e7', deep: '#3868a1' }
    };

    const skinPalettes = {
      cream: { skin: '#fff0c7', light: '#fffaf0', deep: '#edc77e' },
      peach: { skin: '#ffd2c5', light: '#fff0eb', deep: '#eaa18f' },
      mint:  { skin: '#caefdc', light: '#edfff5', deep: '#8fcbb1' },
      lilac: { skin: '#ded5f4', light: '#f5f1ff', deep: '#ad9bd5' },
      sky:   { skin: '#d2e8f5', light: '#f1faff', deep: '#95bfd7' }
    };

    const stateCopy = {
      idle: {
        title: '待机状态',
        live: '正在安静待机',
        caption: '轻轻呼吸、眨眼，偶尔挥手等你回来。'
      },
      study: {
        title: '学习状态',
        live: '正在认真学习',
        caption: '书本随呼吸轻轻起伏，翻页时蹦出一点灵感。'
      },
      music: {
        title: '听歌状态',
        live: '正在听喜欢的歌',
        caption: '头梁跨过头顶，左右耳罩同时戴好，跟着节奏摇摆。'
      },
      fitness: {
        title: '健身状态',
        live: '正在完成今日训练',
        caption: '举起杠铃再低位深蹲，动作小幅但很认真。'
      },
      gaming: {
        title: '游戏状态',
        live: '正在打一局游戏',
        caption: '双手握住手柄，按键反馈和小幅弹跳形成循环。'
      }
    };

    const root = document.documentElement;
    const liko = document.getElementById('liko');
    const titleNode = document.getElementById('stateTitle');
    const captionNode = document.getElementById('stateCaption');
    const liveNode = document.getElementById('liveState');
    const svgTitle = document.getElementById('likoTitle');

    function setPressed(selector, active) {
      document.querySelectorAll(selector).forEach((item) => {
        item.setAttribute('aria-pressed', String(item === active));
      });
    }

    function setShell(name, button) {
      const palette = shellPalettes[name];
      root.style.setProperty('--shell', palette.shell);
      root.style.setProperty('--shell-light', palette.light);
      root.style.setProperty('--shell-deep', palette.deep);
      if (button) setPressed('.shell-swatch', button);
    }

    function setSkin(name, button) {
      const palette = skinPalettes[name];
      root.style.setProperty('--skin', palette.skin);
      root.style.setProperty('--skin-light', palette.light);
      root.style.setProperty('--skin-deep', palette.deep);
      if (button) setPressed('.skin-swatch', button);
    }

    document.querySelectorAll('.state-btn').forEach((button) => {
      button.addEventListener('click', () => {
        const state = button.dataset.state;
        const copy = stateCopy[state];
        setPressed('.state-btn', button);
        liko.dataset.state = state;
        titleNode.textContent = copy.title;
        captionNode.textContent = copy.caption;
        liveNode.textContent = copy.live;
        svgTitle.textContent = `Liko ${copy.title}动画`;
      });
    });

    document.querySelectorAll('.shell-swatch').forEach((button) => {
      button.addEventListener('click', () => setShell(button.dataset.palette, button));
    });

    document.querySelectorAll('.skin-swatch').forEach((button) => {
      button.addEventListener('click', () => setSkin(button.dataset.palette, button));
    });

    document.getElementById('randomize').addEventListener('click', () => {
      const shellButtons = [...document.querySelectorAll('.shell-swatch')];
      const skinButtons = [...document.querySelectorAll('.skin-swatch')];
      const shellButton = shellButtons[Math.floor(Math.random() * shellButtons.length)];
      const skinButton = skinButtons[Math.floor(Math.random() * skinButtons.length)];
      setShell(shellButton.dataset.palette, shellButton);
      setSkin(skinButton.dataset.palette, skinButton);
    });
  </script>
</body>
