<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sun 伴生体 · 四状态动画原型</title>
  <style>
    :root {
      --primary: #39dcc0;
      --primary-deep: #16bda4;
      --primary-soft: #c9fff3;
      --accent: #5c8dff;
      --accent-soft: #dbe6ff;
      --ink: #18211f;
      --paper: #f7fffc;
      --surface: rgba(255, 255, 255, .82);
      --shadow: rgba(54, 153, 134, .18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 8%, color-mix(in srgb, var(--primary-soft) 76%, white), transparent 34%),
        radial-gradient(circle at 88% 86%, color-mix(in srgb, var(--accent-soft) 70%, white), transparent 38%),
        #f5fbf9;
    }

    button, input { font: inherit; }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .brand small {
      display: block;
      margin-bottom: 8px;
      color: var(--primary-deep);
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    .subtitle {
      max-width: 620px;
      margin: 12px 0 0;
      color: #65716e;
      line-height: 1.7;
    }

    .serial-pill {
      flex: none;
      padding: 10px 14px;
      border: 1px solid color-mix(in srgb, var(--primary) 40%, white);
      border-radius: 999px;
      color: var(--primary-deep);
      background: var(--surface);
      box-shadow: 0 10px 30px var(--shadow);
      font-weight: 900;
      letter-spacing: .08em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(290px, .7fr);
      gap: 22px;
      align-items: stretch;
    }

    .stage,
    .panel {
      border: 1px solid rgba(132, 173, 163, .18);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: 0 22px 60px rgba(80, 122, 112, .12);
      backdrop-filter: blur(18px);
    }

    .stage {
      position: relative;
      min-height: 650px;
      overflow: hidden;
      isolation: isolate;
    }

    .stage::before,
    .stage::after {
      position: absolute;
      z-index: -1;
      content: "";
      border-radius: 50%;
      filter: blur(2px);
    }

    .stage::before {
      width: 330px;
      height: 330px;
      top: -140px;
      right: -100px;
      background: color-mix(in srgb, var(--primary-soft) 58%, transparent);
    }

    .stage::after {
      width: 260px;
      height: 260px;
      bottom: -120px;
      left: -70px;
      background: color-mix(in srgb, var(--accent-soft) 62%, transparent);
    }

    .stage-head {
      position: absolute;
      z-index: 2;
      top: 22px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      color: #5c6966;
      font-size: 14px;
      font-weight: 700;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--primary) 16%, transparent);
      animation: pulse 2s ease-in-out infinite;
    }

    .scene-title {
      color: var(--primary-deep);
      font-weight: 900;
    }

    .mascot-wrap {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 72px 14px 92px;
    }

    #mascot {
      width: min(570px, 94%);
      max-height: 540px;
      overflow: visible;
      filter: drop-shadow(0 26px 28px var(--shadow));
    }

    .caption {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .caption-main strong {
      display: block;
      margin-bottom: 5px;
      font-size: 22px;
    }

    .caption-main span {
      color: #71807c;
      font-size: 14px;
    }

    .caption-code {
      flex: none;
      color: var(--primary-deep);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 24px;
    }

    .panel-section h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mode-btn {
      min-height: 76px;
      padding: 12px;
      border: 1px solid rgba(128, 161, 153, .2);
      border-radius: 18px;
      color: #52605d;
      background: rgba(255,255,255,.76);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .mode-btn:hover { transform: translateY(-2px); }

    .mode-btn[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--primary) 58%, white);
      color: var(--primary-deep);
      background: color-mix(in srgb, var(--primary-soft) 46%, white);
      box-shadow: 0 12px 24px var(--shadow);
    }

    .mode-btn b,
    .mode-btn span { display: block; }

    .mode-btn b {
      margin-bottom: 4px;
      font-size: 15px;
    }

    .mode-btn span {
      color: #7b8885;
      font-size: 12px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .swatch {
      aspect-ratio: 1;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px rgba(82, 112, 104, .18), 0 8px 16px rgba(68, 106, 96, .12);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .swatch:hover,
    .swatch[aria-pressed="true"] {
      transform: scale(1.12);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch) 36%, white), 0 10px 18px rgba(68, 106, 96, .16);
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: #67736f;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(128, 161, 153, .24);
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: rgba(255,255,255,.82);
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 16%, transparent);
    }

    .note {
      margin-top: auto;
      padding: 16px;
      border-radius: 18px;
      color: #5f6d69;
      background: color-mix(in srgb, var(--primary-soft) 30%, white);
      font-size: 13px;
      line-height: 1.65;
    }

    /* SVG shared styling */
    .outline { stroke: var(--primary); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .accent-stroke { stroke: var(--accent); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .primary-fill { fill: var(--primary); }
    .deep-fill { fill: var(--primary-deep); }
    .accent-fill { fill: var(--accent); }
    .soft-fill { fill: var(--primary-soft); }
    .ink-fill { fill: var(--ink); }
    .activity { display: none; }
    #mascot[data-mode="study"] .activity-study,
    #mascot[data-mode="music"] .activity-music,
    #mascot[data-mode="fitness"] .activity-fitness,
    #mascot[data-mode="gaming"] .activity-gaming { display: block; }

    .body-shell {
      transform-origin: 180px 190px;
      animation: breathe 2.8s ease-in-out infinite;
    }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.8s ease-in-out infinite;
    }

    .headphone-band {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      opacity: .94;
    }

    .ear-pad { fill: var(--accent); }
    .ear-light { fill: var(--primary-soft); opacity: .88; }
    .ground-shadow { fill: color-mix(in srgb, var(--primary) 22%, transparent); }

    /* Study */
    .activity-study .book {
      transform-origin: 180px 235px;
      animation: bookBob 2.4s ease-in-out infinite;
    }
    .activity-study .page-line {
      stroke: color-mix(in srgb, var(--primary-deep) 74%, white);
      stroke-width: 3;
      stroke-linecap: round;
    }
    .activity-study .page-flip {
      transform-origin: 180px 210px;
      animation: pageFlip 3.6s ease-in-out infinite;
    }
    .activity-study .idea-star { animation: ideaPop 2.8s ease-in-out infinite; }

    /* Music */
    #mascot[data-mode="music"] .body-shell {
      animation: musicSway 1.25s ease-in-out infinite alternate;
    }
    .activity-music .note-a { animation: noteRise 2.3s ease-out infinite; }
    .activity-music .note-b { animation: noteRise 2.3s .7s ease-out infinite; }
    .activity-music .note-c { animation: noteRise 2.3s 1.35s ease-out infinite; }
    .activity-music .wave {
      fill: none;
      stroke: var(--primary);
      stroke-width: 4;
      stroke-linecap: round;
      opacity: .45;
      animation: wavePulse 1.25s ease-in-out infinite;
    }

    /* Fitness */
    #mascot[data-mode="fitness"] .body-shell {
      animation: squat 1.55s ease-in-out infinite;
    }
    .activity-fitness .weight-left {
      transform-origin: 112px 212px;
      animation: liftLeft 1.55s ease-in-out infinite;
    }
    .activity-fitness .weight-right {
      transform-origin: 248px 212px;
      animation: liftRight 1.55s ease-in-out infinite;
    }
    .activity-fitness .sweat { animation: sweatDrop 1.55s ease-in infinite; }

    /* Gaming */
    #mascot[data-mode="gaming"] .body-shell {
      animation: gameBounce 1.8s ease-in-out infinite;
    }
    .activity-gaming .controller {
      transform-origin: 180px 242px;
      animation: controllerTap .7s ease-in-out infinite alternate;
    }
    .activity-gaming .spark-a { animation: pixelPop 1.4s ease-out infinite; }
    .activity-gaming .spark-b { animation: pixelPop 1.4s .45s ease-out infinite; }
    .activity-gaming .spark-c { animation: pixelPop 1.4s .9s ease-out infinite; }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.012, .99); }
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.12); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.82); opacity: .65; }
    }
    @keyframes bookBob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }
    @keyframes pageFlip {
      0%, 20%, 100% { transform: skewX(0deg) scaleX(1); opacity: .8; }
      45% { transform: skewX(-20deg) scaleX(.25); opacity: .35; }
      60% { transform: skewX(10deg) scaleX(1); opacity: .8; }
    }
    @keyframes ideaPop {
      0%, 25%, 100% { transform: scale(.5) rotate(-12deg); opacity: 0; }
      45%, 72% { transform: scale(1) rotate(8deg); opacity: 1; }
    }
    @keyframes musicSway {
      from { transform: translate(-5px, 1px) rotate(-2.1deg); }
      to { transform: translate(5px, -4px) rotate(2.1deg); }
    }
    @keyframes noteRise {
      0% { transform: translateY(18px) scale(.75); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(-34px) scale(1.08) rotate(8deg); opacity: 0; }
    }
    @keyframes wavePulse {
      0%, 100% { transform: scaleX(.72); opacity: .18; }
      50% { transform: scaleX(1); opacity: .55; }
    }
    @keyframes squat {
      0%, 100% { transform: translateY(-5px) scaleY(1.02); }
      48% { transform: translateY(15px) scale(1.025, .94); }
    }
    @keyframes liftLeft {
      0%, 100% { transform: translate(0, 15px) rotate(-4deg); }
      50% { transform: translate(-8px, -50px) rotate(10deg); }
    }
    @keyframes liftRight {
      0%, 100% { transform: translate(0, 15px) rotate(4deg); }
      50% { transform: translate(8px, -50px) rotate(-10deg); }
    }
    @keyframes sweatDrop {
      0%, 42% { transform: translate(0, 0) scale(.6); opacity: 0; }
      56% { opacity: 1; }
      100% { transform: translate(5px, 28px) scale(1); opacity: 0; }
    }
    @keyframes gameBounce {
      0%, 100% { transform: translateY(2px) rotate(-.7deg); }
      50% { transform: translateY(-6px) rotate(.7deg); }
    }
    @keyframes controllerTap {
      from { transform: rotate(-2deg) translateY(1px); }
      to { transform: rotate(2deg) translateY(-3px); }
    }
    @keyframes pixelPop {
      0% { transform: translateY(12px) scale(.4); opacity: 0; }
      30%, 72% { opacity: 1; }
      100% { transform: translateY(-28px) scale(1.15) rotate(18deg); opacity: 0; }
    }

    @media (max-width: 820px) {
      .topbar { display: block; }
      .serial-pill { display: inline-block; margin-top: 18px; }
      .layout { grid-template-columns: 1fr; }
      .stage { min-height: 590px; }
      .panel { min-height: auto; }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 20px, 1120px); padding-top: 20px; }
      .stage, .panel { border-radius: 24px; }
      .stage { min-height: 520px; }
      .mascot-wrap { padding: 72px 2px 100px; }
      .caption { align-items: flex-end; }
      .caption-main strong { font-size: 18px; }
      .caption-main span { display: none; }
      .caption-code { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <small>Sun Companion Design 01</small>
        <h1>同一种小生命，<br />只属于你的这一只。</h1>
        <p class="subtitle">统一轮廓、专属异色、永久编号和独立人格。四个循环状态对应它最自然的校园日常。</p>
      </div>
      <div class="serial-pill" data-code>SUN #000128</div>
    </header>

    <section class="layout">
      <article class="stage">
        <div class="stage-head">
          <div class="status"><i class="status-dot"></i><span id="statusText">正在安静学习</span></div>
          <div class="scene-title" id="sceneTitle">学习状态</div>
        </div>

        <div class="mascot-wrap">
          <svg id="mascot" data-mode="study" viewBox="0 0 360 360" role="img" aria-labelledby="mascotTitle mascotDesc">
            <title id="mascotTitle">Sun 伴生体学习动画</title>
            <desc id="mascotDesc">圆润的果冻形 AI 伴生体，佩戴耳机，正在进行四种校园活动之一。</desc>
            <defs>
              <linearGradient id="bodyGradient" x1=".12" y1=".08" x2=".88" y2=".94">
                <stop offset="0" style="stop-color: color-mix(in srgb, var(--primary-soft) 55%, white)" />
                <stop offset=".55" style="stop-color: color-mix(in srgb, var(--primary-soft) 88%, white)" />
                <stop offset="1" style="stop-color: color-mix(in srgb, var(--primary) 22%, white)" />
              </linearGradient>
              <linearGradient id="bookGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" style="stop-color: var(--primary)" />
                <stop offset="1" style="stop-color: var(--primary-deep)" />
              </linearGradient>
              <linearGradient id="beanGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" style="stop-color: var(--accent-soft)" />
                <stop offset="1" style="stop-color: var(--accent)" />
              </linearGradient>
            </defs>

            <ellipse class="ground-shadow" cx="180" cy="315" rx="104" ry="14" />

            <g class="body-shell">
              <path d="M180 72 C112 70 75 113 75 190 C75 268 112 307 180 307 C248 307 285 267 285 190 C285 113 248 70 180 72 Z" fill="url(#bodyGradient)" class="outline" />
              <path d="M83 170 C62 172 57 195 72 207 C82 215 88 213 96 207" fill="url(#bodyGradient)" class="outline" />
              <path d="M277 170 C298 172 303 195 288 207 C278 215 272 213 264 207" fill="url(#bodyGradient)" class="outline" />

              <path class="headphone-band" d="M103 154 C101 99 131 69 180 69 C229 69 259 99 257 154" />
              <rect class="ear-pad" x="91" y="141" width="27" height="54" rx="13" />
              <rect class="ear-pad" x="242" y="141" width="27" height="54" rx="13" />
              <ellipse class="ear-light" cx="105" cy="167" rx="8" ry="15" />
              <ellipse class="ear-light" cx="255" cy="167" rx="8" ry="15" />

              <ellipse class="eye ink-fill" cx="155" cy="185" rx="7" ry="10" />
              <ellipse class="eye ink-fill" cx="205" cy="185" rx="7" ry="10" />

              <!-- Study face and props -->
              <g class="activity activity-study">
                <path d="M166 205 Q180 215 194 205" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" />
                <g class="book">
                  <path d="M103 221 Q140 205 178 224 L178 285 Q140 263 102 276 Z" fill="url(#bookGradient)" />
                  <path d="M257 221 Q220 205 182 224 L182 285 Q220 263 258 276 Z" fill="url(#bookGradient)" />
                  <path d="M178 224 L182 224 L182 285 L178 285 Z" fill="white" opacity=".88" />
                  <path d="M113 230 Q145 220 169 232" class="page-line" fill="none" />
                  <path d="M247 230 Q215 220 191 232" class="page-line" fill="none" />
                  <path d="M113 242 Q145 232 169 244" class="page-line" fill="none" opacity=".64" />
                  <path d="M247 242 Q215 232 191 244" class="page-line" fill="none" opacity=".64" />
                  <path class="page-flip" d="M182 224 Q213 203 250 220 L250 231 Q216 215 182 234 Z" fill="white" opacity=".85" />
                </g>
                <g class="idea-star" transform="translate(250 96)">
                  <path d="M0 -13 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" class="accent-fill" />
                </g>
              </g>

              <!-- Music face and props -->
              <g class="activity activity-music">
                <path d="M151 212 Q180 234 209 212" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" />
                <path class="wave" d="M112 250 Q126 232 140 250 T168 250 T196 250 T224 250 T252 250" />
                <g class="note-a primary-fill" transform="translate(92 112)"><circle cx="0" cy="12" r="8" /><path d="M6 12 V-16 H21" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" /></g>
                <g class="note-b accent-fill" transform="translate(260 119)"><circle cx="0" cy="12" r="8" /><path d="M6 12 V-18 L23 -13" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" /></g>
                <g class="note-c deep-fill" transform="translate(278 232)"><circle cx="0" cy="10" r="7" /><path d="M5 10 V-13 H17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" /></g>
              </g>

              <!-- Fitness face and props -->
              <g class="activity activity-fitness">
                <path d="M158 216 Q180 202 202 216" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" />
                <g class="weight-left">
                  <path d="M93 222 Q105 205 118 198" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" />
                  <rect x="64" y="189" width="43" height="12" rx="6" class="ink-fill" />
                  <rect x="60" y="180" width="11" height="30" rx="5" class="accent-fill" />
                  <rect x="100" y="180" width="11" height="30" rx="5" class="accent-fill" />
                </g>
                <g class="weight-right">
                  <path d="M267 222 Q255 205 242 198" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round" />
                  <rect x="253" y="189" width="43" height="12" rx="6" class="ink-fill" />
                  <rect x="249" y="180" width="11" height="30" rx="5" class="accent-fill" />
                  <rect x="289" y="180" width="11" height="30" rx="5" class="accent-fill" />
                </g>
                <path d="M145 263 Q180 278 215 263" fill="none" stroke="var(--primary-deep)" stroke-width="7" stroke-linecap="round" opacity=".5" />
                <path class="sweat accent-fill" d="M229 132 C238 143 238 150 229 154 C220 150 220 143 229 132 Z" />
              </g>

              <!-- Gaming face and props -->
              <g class="activity activity-gaming">
                <path d="M153 210 Q180 231 207 210" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" />
                <path d="M80 270 Q102 239 138 251 Q180 228 222 251 Q258 239 280 270 Q296 288 277 302 H83 Q64 288 80 270 Z" fill="url(#beanGradient)" opacity=".96" />
                <g class="controller">
                  <path d="M131 228 Q180 212 229 228 L246 266 Q249 282 234 284 Q222 285 211 264 H149 Q138 285 126 284 Q111 282 114 266 Z" fill="var(--primary)" stroke="var(--primary-deep)" stroke-width="4" />
                  <path d="M145 245 H163 M154 236 V254" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" />
                  <circle cx="211" cy="242" r="5" fill="#ff6ca8" />
                  <circle cx="224" cy="252" r="5" fill="#ffd35c" />
                  <circle cx="209" cy="258" r="5" fill="var(--accent)" />
                </g>
                <rect class="spark-a primary-fill" x="86" y="221" width="9" height="9" rx="2" />
                <rect class="spark-b accent-fill" x="272" y="207" width="10" height="10" rx="2" />
                <path class="spark-c" d="M276 156 L280 165 L290 169 L280 173 L276 182 L272 173 L262 169 L272 165 Z" fill="#ff6ca8" />
              </g>

              <path d="M139 301 Q151 292 165 303 V316 H136 Q134 307 139 301 Z" class="primary-fill" />
              <path d="M221 301 Q209 292 195 303 V316 H224 Q226 307 221 301 Z" class="primary-fill" />
            </g>
          </svg>
        </div>

        <div class="caption">
          <div class="caption-main">
            <strong id="companionNameText">小满正在安静学习</strong>
            <span id="captionText">书页轻轻浮动，偶尔眨眼，像在认真消化新知识。</span>
          </div>
          <div class="caption-code" data-code>SUN #000128</div>
        </div>
      </article>

      <aside class="panel">
        <section class="panel-section">
          <h2>四个循环动画</h2>
          <div class="modes" role="group" aria-label="选择动画状态">
            <button class="mode-btn" data-mode="study" aria-pressed="true"><b>学习</b><span>阅读与灵感</span></button>
            <button class="mode-btn" data-mode="music" aria-pressed="false"><b>听歌</b><span>摇摆与音符</span></button>
            <button class="mode-btn" data-mode="fitness" aria-pressed="false"><b>健身</b><span>深蹲与举重</span></button>
            <button class="mode-btn" data-mode="gaming" aria-pressed="false"><b>打游戏</b><span>手柄与反馈</span></button>
          </div>
        </section>

        <section class="panel-section">
          <h2>异色预览</h2>
          <div class="palette-grid" role="group" aria-label="选择伴生体配色">
            <button class="swatch" aria-label="薄荷异色" aria-pressed="true" style="--swatch:#39dcc0" data-palette="mint"></button>
            <button class="swatch" aria-label="天空异色" aria-pressed="false" style="--swatch:#60a5fa" data-palette="sky"></button>
            <button class="swatch" aria-label="蜜桃异色" aria-pressed="false" style="--swatch:#ff8caf" data-palette="peach"></button>
            <button class="swatch" aria-label="葡萄异色" aria-pressed="false" style="--swatch:#9a7df5" data-palette="grape"></button>
            <button class="swatch" aria-label="日光异色" aria-pressed="false" style="--swatch:#f6c453" data-palette="sunny"></button>
            <button class="swatch" aria-label="珊瑚异色" aria-pressed="false" style="--swatch:#ff7b68" data-palette="coral"></button>
          </div>
        </section>

        <section class="panel-section" style="display:grid; gap:12px">
          <div class="field">
            <label for="nameInput">伴生体名字</label>
            <input id="nameInput" value="小满" maxlength="8" />
          </div>
          <div class="field">
            <label for="codeInput">唯一公开编号</label>
            <input id="codeInput" value="SUN #000128" maxlength="18" />
          </div>
        </section>

        <div class="note">这版刻意不加入等级、属性、服装或复杂器官变化。角色识别只依靠统一轮廓、专属颜色、永久编号和人格；动画均由矢量图形驱动，可继续改造成小程序 Canvas、SVG 或 Lottie。</div>
      </aside>
    </section>
  </main>

  <script>
    const palettes = {
      mint:  { primary: '#39dcc0', deep: '#16bda4', soft: '#c9fff3', accent: '#5c8dff', accentSoft: '#dbe6ff' },
      sky:   { primary: '#60a5fa', deep: '#347de2', soft: '#d9edff', accent: '#8b7cf6', accentSoft: '#e7e2ff' },
      peach: { primary: '#ff8caf', deep: '#e75e8a', soft: '#ffe0ea', accent: '#7c8cff', accentSoft: '#e2e7ff' },
      grape: { primary: '#9a7df5', deep: '#7357d6', soft: '#e9e2ff', accent: '#42cdb2', accentSoft: '#d8fff6' },
      sunny: { primary: '#f6c453', deep: '#d99a21', soft: '#fff0bd', accent: '#5a9df8', accentSoft: '#dcecff' },
      coral: { primary: '#ff7b68', deep: '#dd5544', soft: '#ffe0da', accent: '#4dbbcf', accentSoft: '#d8f7fb' }
    };

    const modeCopy = {
      study:   { title: '学习状态', status: '正在安静学习', sentence: '书页轻轻浮动，偶尔眨眼，像在认真消化新知识。' },
      music:   { title: '听歌状态', status: '正在循环最近喜欢的歌', sentence: '身体跟着节奏左右摇摆，耳机与音符一起呼吸。' },
      fitness: { title: '健身状态', status: '正在完成今天的训练', sentence: '小幅深蹲和举重循环，认真但不会显得过分用力。' },
      gaming:  { title: '游戏状态', status: '正在打一局游戏', sentence: '窝在软垫里按动手柄，胜负反馈用像素火花表达。' }
    };

    const root = document.documentElement;
    const mascot = document.querySelector('#mascot');
    const nameInput = document.querySelector('#nameInput');
    const codeInput = document.querySelector('#codeInput');
    const statusText = document.querySelector('#statusText');
    const sceneTitle = document.querySelector('#sceneTitle');
    const captionText = document.querySelector('#captionText');
    const companionNameText = document.querySelector('#companionNameText');

    function updateCaption() {
      const mode = mascot.dataset.mode;
      const copy = modeCopy[mode];
      const name = nameInput.value.trim() || '它';
      statusText.textContent = copy.status;
      sceneTitle.textContent = copy.title;
      companionNameText.textContent = `${name}${copy.status.replace('正在', '正在')}`;
      captionText.textContent = copy.sentence;
      mascot.querySelector('title').textContent = `Sun 伴生体${copy.title}动画`;
    }

    document.querySelectorAll('.mode-btn').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach((item) => item.setAttribute('aria-pressed', 'false'));
        button.setAttribute('aria-pressed', 'true');
        mascot.dataset.mode = button.dataset.mode;
        updateCaption();
      });
    });

    document.querySelectorAll('.swatch').forEach((button) => {
      button.addEventListener('click', () => {
        const palette = palettes[button.dataset.palette];
        document.querySelectorAll('.swatch').forEach((item) => item.setAttribute('aria-pressed', 'false'));
        button.setAttribute('aria-pressed', 'true');
        root.style.setProperty('--primary', palette.primary);
        root.style.setProperty('--primary-deep', palette.deep);
        root.style.setProperty('--primary-soft', palette.soft);
        root.style.setProperty('--accent', palette.accent);
        root.style.setProperty('--accent-soft', palette.accentSoft);
      });
    });

    nameInput.addEventListener('input', updateCaption);
    codeInput.addEventListener('input', () => {
      const value = codeInput.value.trim() || 'SUN #------';
      document.querySelectorAll('[data-code]').forEach((node) => { node.textContent = value; });
    });

    updateCaption();
  </script>
</body>
</html>
